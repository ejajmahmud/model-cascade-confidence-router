[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-cascade-confidence-router"
version = "0.1.0"
description = "Routes requests from fast edge/flash models to frontier reasoning models based on verification and uncertainty signals"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
model-cascade-confidence-router = "model_cascade_confidence_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_cascade_confidence_router*"]
